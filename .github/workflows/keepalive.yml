name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit pages that query the database
        run: |
          curl -fsS --retry 3 --retry-delay 10 -o /dev/null -w "categories: %{http_code}\n" https://dosled.com/categories
